<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calander</title>
    <link rel="icon"
        href="https://png.pngtree.com/png-clipart/20250625/original/pngtree-minimal-calendar-icon-vector-png-image_21233134.png">
    <link rel="stylesheet" href="./index.css">
    <script src="./index.js" defer></script>
</head>

<body>
    <div>
        <div class="header-container">
            <div>
                <button class="left-btn">&larr;</button>
                <div class="label-container">
                    <h1 class="month-container">october</h1>
                    <button class="today">today</button>
                </div>
                <button class="right-btn">&rarr;</button>
            </div>

            <table class="week-container">
                <thead>
                    <tr>
                        <th>Sun</th>
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thu</th>
                        <th>Fri</th>
                        <th>Sat</th>
                    </tr>
                </thead>
                <tbody class="table-body">

                </tbody>
            </table>

        </div>

    </div>
</body>

</html>
