<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Projects Portal</title>
    <style>
        :root {
            --bg: #f7f7fb;
            --muted: #666
        }

        body {
            font-family: system-ui, Segoe UI, Arial;
            margin: 24px;
            background: var(--bg);
            color: #111
        }

        h1 {
            margin: 0 0 6px
        }

        .muted {
            color: var(--muted);
            font-size: 0.95rem
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            margin-top: 18px
        }

        .card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(15, 20, 30, 0.06)
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #e9e9ef
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .card h3 {
            margin: 0;
            font-size: 1.05rem
        }

        .desc {
            font-size: 0.93rem;
            color: var(--muted)
        }

        .links {
            display: flex;
            gap: 8px;
            margin-top: auto
        }

        .btn {
            padding: 8px 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem
        }

        .btn.local {
            background: #eef2ff;
            color: #1e3a8a
        }

        .btn.repo {
            background: #f3f4f6;
            color: #111
        }

        .btn.live {
            background: #e6ffef;
            color: #065f46
        }

        .small {
            font-size: 0.85rem;
            color: var(--muted)
        }
    </style>
</head>

<body>
    <h1>Projects Portal</h1>
    <p class="muted">Click a card to open the local demo, the GitHub source, or the live deployment.</p>

    <div id="cards" class="grid" aria-live="polite"></div>

    <script>
        function placeholderImage(name) {
            const svg = `<?xml version='1.0' encoding='utf-8'?>` +
                `<svg xmlns='http://www.w3.org/2000/svg' width='640' height='360'>` +
                `<rect width='100%' height='100%' fill='%23e9e9ef' />` +
                `<text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23666' font-family='Arial, Helvetica, sans-serif' font-size='28'>${name}</text>` +
                `</svg>`;
            return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
        }

        async function load() {
            const res = await fetch('projects.json');
            const projects = await res.json();
            const root = document.getElementById('cards');
            projects.forEach(p => {
                const imgSrc = p.image || placeholderImage(p.name);
                const card = document.createElement('article');
                card.className = 'card';
                // include onerror fallback to embedded placeholder so broken remote images are replaced
                const fallback = placeholderImage(p.name);
                card.innerHTML = `
                    <img src="${imgSrc}" alt="${p.name} screenshot" loading="lazy" onerror="this.onerror=null;this.src='${fallback}'" />
                    <div class="card-body">
                        <h3>${p.name}</h3>
                        <div class="desc small">${p.githubRepo ? 'Source available on GitHub' : ''}</div>
                        <div class="links">
                            <a class="btn local" ${p.localPath ? `href="${p.localPath}" target="_blank"` : 'href="#" onclick="return false;"'}>Local</a>
                            <a class="btn repo" ${p.githubRepo ? `href="${p.githubRepo}" target="_blank"` : 'href="#" onclick="return false;"'}>GitHub</a>
                            <a class="btn live" ${p.liveUrl ? `href="${p.liveUrl}" target="_blank"` : 'href="#" onclick="return false;"'}>Live</a>
                        </div>
                    </div>`;
                root.appendChild(card);
            })
        }

        load().catch(err => {
            document.body.insertAdjacentHTML('beforeend', `<p class="muted">Error loading projects.json: ${err.message}</p>`)
        })
    </script>

</body>

</html>
