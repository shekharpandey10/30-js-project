<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5ZE6TSSordh926_n4nuJkha2Wwzbl6eO7UBKhPU5Ddw&s&ec=121643199">
    <link rel="stylesheet" href="./index.css" />
    <script src="./index.js" defer></script>
</head>

<body>
    <main class="main-container">
        <div>
            <h1>Number counter</h1>
            <button class="reset-btn">Reset</button>

            <div class="counter-box">
                <div class="number">0</div>
                <button class="increase">+</button>
                <button class="decrease">-</button>
            </div>
            <button class="save-btn">Save</button>

        </div>
        <div>
            <h1>Number Saved</h1>
            <div class="saved-number">

            </div>
        </div>
        <button class="clear-btn">clear List</button>
    </main>
    <div class="footer">
        <a href="https://github.com/shekharpandey10"> ❤️ by shekharpandey10</a>
    </div>
</body>

</html>
