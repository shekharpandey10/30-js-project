<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Paint</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="icon"
        href="https://img.freepik.com/premium-psd/paint-brush-stroke-isolated-transparent-background-png_699917-5876.jpg?semt=ais_hybrid&w=740&q=80">
    <script src="./index.js" defer></script>
</head>

<body>
    <div class="end-container">
        <h1>Drawing Paint</h1>
    </div>
    <canvas class="main-container"></canvas>

    <div class="footer">
        <a href="https://github.com/shekharpandey10"> ❤️ by shekharpandey10</a>
    </div>
    <div class="side-bar">
        <label for="">Color:
            <input type="color" name="color-bar" id="Color">
        </label>
        <label for="">Gradient:
            <input type="color" name="color-bar" id="Gradient" disabled="true">
        </label>
        <label for="">Stroke:
            <input type="number" name="color-bar" id="Stroke" height="5px" width="5px">
        </label>
        <div class="radio-box-container">

            <button type="button" name="Eraser" id="Eraser">Clear</button>
        </div>
    </div>
</body>

</html>
