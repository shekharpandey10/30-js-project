<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word counter</title>
    <link rel="icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpjckAYz7ADk76wtt2DfJiiorbyoXbAzYgrA&s">
    <link rel="stylesheet" href="./index.css">
    <script src="./index.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Word Counter
        </h1>
        <textarea name="" id="" placeholder="Enter your Text here" rows="15" cols="55" class="textfield"></textarea>
        <div>
            <div>Characters: <span class="Characters">0</span></div>
            <div>Numbers: <span class="num">0</span></div>
            <div>Words: <span class="Words">0</span></div>
            <div>Sentences: <span class="Sentences">0</span></div>
            <div>Paragraphs: <span class="Paragraphs">0</span></div>
        </div>
    </div>
    <div class="footer">
        <a href="https://github.com/shekharpandey10"> ❤️ by shekharpandey10</a>
    </div>
</body>

</html>
